name: "Build"
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile && pnpm build

      - name: Archive result
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist


